name: PR events spike
run-name: "pr-events ${{ github.event.action }} #${{ github.event.number }} base=${{ github.event.pull_request.base.ref }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches-ignore: [checks-base]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Event
        env:
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.ref }}
          CHANGES: ${{ toJSON(github.event.changes) }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "action=$ACTION base=$BASE sender=$SENDER"
          echo "changes=$CHANGES"
